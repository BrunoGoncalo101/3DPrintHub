spring.application.name=loja3d-backend

# Lê o ficheiro .env (se existir) na raiz do projeto. O .env NUNCA vai para o Git.
spring.config.import=optional:file:./.env[.properties]

# Base de dados (valores vêm do .env ou das variáveis de ambiente)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Só o Flyway altera a estrutura; o Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Ficheiros 3D (máx. 50 MB, RNF03)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.uploads.dir=${UPLOADS_DIR:uploads}

# Chave do token JWT (usada pelo módulo de segurança)
app.jwt.secret=${JWT_SECRET:}
